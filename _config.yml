# Basic Site Settings
locale                   : "en-US"
site_theme               : "default"
title                    : "Covadonga Gonzalez-Blas"
title_separator          : "-"
name                     : &name "Covadonga Gonzalez-Blas"
description              : &description "Finance student | MFE & M&A Candidate"
url                      : "https://Gonzalez-Blas.github.io"
baseurl                  : ""
repository               : "Gonzalez-Blas/Gonzalez-Blas.github.io"

# Author Profile (Sidebar)
author:
  avatar           : "profile.png"
  name             : "Covadonga Gonzalez-Blas"
  bio              : "BBA Student at ICADE | MFE & M&A Candidate"
  location         : "Madrid, Spain"
  employer         : "Universidad Pontificia de Comillas - ICADE"
  email            : "cglblpe@gmail.com" 
  github           : "Gonzalez-Blas"
  linkedin         : "https://www.linkedin.com/in/covadonga-gonzalez-blas"
  uri              : "https://comillaspevcclub.es/"

# Site Settings
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false

# SEO Related
og_image                 : og-image.png

# Build Settings (Do not change these)
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

collections:
  portfolio:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Etc/UTC

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

compress_html:
  clippings: all
  ignore:
    envs: development





